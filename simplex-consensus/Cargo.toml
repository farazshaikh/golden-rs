[package]
name = "simplex-demo"
version = "0.2.5"
edition = "2021"
authors = ["Faraz Shaikh <faraz.shaikh@gmail.com>"]
description = "Simplex BFT consensus demo with vetKeys IBE (workspace-only, not published)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
golden-dkg = { path = "../golden-dkg" }
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.3"
rayon = "1"

# Demo binary deps
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.28"

[[bin]]
name = "simplex-demo"
path = "src/bin/main.rs"
