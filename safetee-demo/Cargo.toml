[package]
name = "safetee-demo"
version = "0.1.0"
edition = "2021"
authors = ["Faraz Shaikh <faraz.shaikh@gmail.com>"]
description = "SAFE-TEE demo: GCP Confidential VM + vetKeys key delivery + encrypted inference"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
golden-dkg = { path = "../golden-dkg" }
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.3"
rayon = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"

[[bin]]
name = "safetee-demo"
path = "src/main.rs"

[[bin]]
name = "safetee-server"
path = "src/server.rs"

[[bin]]
name = "safetee-sidecar"
path = "src/sidecar.rs"
