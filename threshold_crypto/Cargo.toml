[package]
name = "threshold-demo"
version = "0.2.5"
edition = "2021"
authors = ["Faraz Shaikh <faraz.shaikh@gmail.com>"]
description = "Threshold BLS beacon demo (workspace-only, not published)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
golden-dkg = { path = "../golden-dkg" }
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-std = { workspace = true }
ark-serialize = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rayon = "1"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.28"
