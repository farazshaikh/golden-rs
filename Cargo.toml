[workspace]
members = ["golden-dkg", "golden-demo"]
resolver = "2"

[workspace.dependencies]
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-std = "0.5"
ark-serialize = { version = "0.5", features = ["derive"] }
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-spartan = { git = "https://github.com/arkworks-rs/spartan" }
merlin = "3.0"
sha2 = "0.10"
rand = "0.8"
borsh = "1"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
