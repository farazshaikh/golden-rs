[package]
name = "golden-dkg"
version = "0.2.6"
edition = "2021"
authors = ["Faraz Shaikh <faraz.shaikh@gmail.com>"]
description = "Golden DKG + threshold BLS signatures + vetKeys IBE + Simplex BFT consensus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/farazshaikh/golden-rs"
documentation = "https://docs.rs/golden-dkg"
readme = "README.md"
keywords = ["dkg", "threshold-crypto", "bls12-381", "vetkeys", "consensus"]
categories = ["cryptography"]

[dependencies]
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-std = { workspace = true }
ark-serialize = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
libspartan = { workspace = true }
merlin = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
borsh = { workspace = true, optional = true }

zeroize = { workspace = true }
tracing = { workspace = true }
hax-lib = "0.3.6"

# Optional deps for threshold and consensus features
rand_chacha = { version = "0.3", optional = true }
rayon = { version = "1", optional = true }

[features]
default = ["threshold", "consensus"]
borsh = ["dep:borsh"]
threshold = ["dep:rand_chacha", "dep:rayon"]
consensus = ["threshold"]

[dev-dependencies]
criterion = { version = "0.5" }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.28"
rayon = "1"
rand_chacha = "0.3"

[[bench]]
name = "dkg"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
