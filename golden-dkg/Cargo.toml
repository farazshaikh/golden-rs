[package]
name = "golden-dkg"
version = "0.1.0"
edition = "2021"
authors = ["Faraz Shaikh <faraz.shaikh@gmail.com>"]
description = "Golden non-interactive distributed key generation (Bünz, Choi, Komlo 2025)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/farazshaikh/golden-rs"
documentation = "https://docs.rs/golden-dkg"
readme = "README.md"
keywords = ["dkg", "threshold-crypto", "bls12-381", "zero-knowledge"]
categories = ["cryptography"]

[dependencies]
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-std = { workspace = true }
ark-serialize = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
libspartan = { workspace = true }
merlin = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
borsh = { workspace = true, optional = true }

zeroize = { workspace = true }
tracing = { workspace = true }
hax-lib = "0.3.6"

[features]
default = []
borsh = ["dep:borsh"]

[dev-dependencies]
criterion = { version = "0.5" }

[[bench]]
name = "dkg"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
